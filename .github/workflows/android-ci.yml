name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"

      - name: Run unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Restore stable signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEIOCR_SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/meiocrworkout-ci.jks"
          else
            echo "Stable signing secrets are not configured; using Android debug signing."
          fi

      - name: Build debug APK
        env:
          MEIOCR_SIGNING_STORE_FILE: ${{ runner.temp }}/meiocrworkout-ci.jks
          MEIOCR_SIGNING_STORE_PASSWORD: ${{ secrets.MEIOCR_SIGNING_STORE_PASSWORD }}
          MEIOCR_SIGNING_KEY_ALIAS: ${{ secrets.MEIOCR_SIGNING_KEY_ALIAS }}
          MEIOCR_SIGNING_KEY_PASSWORD: ${{ secrets.MEIOCR_SIGNING_KEY_PASSWORD }}
        run: gradle assembleDebug --stacktrace

      - name: Show APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk


      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MeiOCRWorkout-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
